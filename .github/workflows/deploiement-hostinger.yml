name: Déployer sur Hostinger

# Le site est statique : il n'y a rien à construire, on envoie le dépôt tel quel.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tant que le compte FTP n'existe pas dans hPanel, le dépôt se fait à la
      # main (zip → gestionnaire de fichiers). On ne fait pas échouer le
      # workflow pour autant : il s'activera tout seul le jour où les trois
      # secrets seront déclarés.
      - name: Vérifier la présence des identifiants
        id: identifiants
        run: |
          if [ -n "${{ secrets.FTP_SERVEUR }}" ] && [ -n "${{ secrets.FTP_UTILISATEUR }}" ] && [ -n "${{ secrets.FTP_MOTDEPASSE }}" ]; then
            echo "pretes=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pretes=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets FTP absents — déploiement automatique ignoré."
          fi

      - name: Envoi FTPS vers public_html
        if: steps.identifiants.outputs.pretes == 'oui'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVEUR }}
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOTDEPASSE }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_DOSSIER || '/public_html/' }}
          # Ne supprime pas ce qui n'appartient pas au site (fichiers de
          # vérification déposés par Google, dossiers créés par l'hébergeur…).
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
